services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PIPELINE_URL=http://pipeline:8001
      - TRADER_URL=http://trader:8002
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - PYTHONPATH=/app
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - redis
      - pipeline
      - trader
    command: >
      uvicorn apps.api.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/apps --reload-dir /app/common --reload-dir /app/service

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - PYTHONPATH=/app
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - redis
    command: >
      uvicorn apps.pipeline.main:app
      --host 0.0.0.0 --port 8001
      --reload --reload-dir /app/apps --reload-dir /app/scripts --reload-dir /app/common

  trader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.trader
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - PYTHONPATH=/app
      - TRADER_AUTOSTART=false
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - redis
    command: >
      uvicorn apps.trader.main:app
      --host 0.0.0.0 --port 8002
      --reload --reload-dir /app/apps --reload-dir /app/service --reload-dir /app/common --reload-dir /app/inputs --reload-dir /app/outputs

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  redis_data:
  web_node_modules:
