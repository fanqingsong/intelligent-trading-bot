services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:16-alpine
    ports:
      # Host 5432 is often taken by other local Postgres; containers still use postgres:5432
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=itb
      - POSTGRES_PASSWORD=itb
      - POSTGRES_DB=itb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itb -d itb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PIPELINE_URL=http://pipeline:8001
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - DATABASE_URL=postgresql+psycopg://itb:itb@postgres:5432/itb
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_UI_URL=http://localhost:4200
      - ITB_STATUS_SYNC_INTERVAL_S=5
      - ITB_JOB_SOURCE=hybrid
      - ITB_REDIS_JOB_MIRROR=1
      - ITB_RBAC_ENABLED=0
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
      # Must match mlflow service path (/mlruns); artifact_uri is absolute /mlruns/<exp>/...
      - mlflow_artifacts:/mlruns
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_started
      prefect-server:
        condition: service_started
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/backend --reload-dir /app/shared --reload-dir /app/kedro_pipeline

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - DATABASE_URL=postgresql+psycopg://itb:itb@postgres:5432/itb
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_UI_URL=http://localhost:4200
      - ITB_JOB_EXECUTOR=prefect
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
      - mlflow_artifacts:/mlruns
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      prefect-server:
        condition: service_healthy
    command: >
      uvicorn kedro_pipeline.main:app
      --host 0.0.0.0 --port 8001
      --reload --reload-dir /app/shared --reload-dir /app/kedro_pipeline

  # Self-hosted Prefect 3 (SQLite volume). Durable queue for Kedro jobs.
  # Keep client (requirements) and this image on the same Prefect minor.
  # China mirror currently only publishes :3-latest (resolved to 3.6.4 here).
  prefect-server:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/prefecthq/prefect:3-latest
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_UI_API_URL=http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Serves itb-kedro-job/default + itb-daily-predict/default (cron).
  prefect-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - DATABASE_URL=postgresql+psycopg://itb:itb@postgres:5432/itb
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_UI_URL=http://localhost:4200
      - PIPELINE_URL=http://pipeline:8001
      - ITB_PREFECT_SERVE_LIMIT=10
      - ITB_TRAIN_CONCURRENCY=1
      - ITB_PREDICT_CONCURRENCY=10
      - ITB_PREDICT_CRON=0 16 * * 1-5
      - ITB_PREDICT_TZ=Asia/Shanghai
      - ITB_PREDICT_ENABLED=true
      - ITB_KEDRO_EXECUTION=fine
      - ITB_TEAMS=default
      - ITB_TEAM=default
      - ITB_ENV=dev
      - ITB_NODE_RETRIES_DOWNLOAD=2
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
      - ../conf:/app/conf
      - mlflow_artifacts:/mlruns
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      prefect-server:
        condition: service_healthy
      pipeline:
        condition: service_started
    # Explicit entrypoint so a locally committed image cannot override CMD with `sleep`.
    entrypoint: ["python", "-m", "kedro_pipeline.orchestration.prefect_serve"]
    command: []
    restart: on-failure

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      # Postgres avoids SQLite write locks while train jobs register models.
      - MLFLOW_BACKEND_STORE_URI=postgresql://itb:itb@postgres:5432/mlflow
      - MLFLOW_ARTIFACT_ROOT=/mlruns
      - MLFLOW_PGHOST=postgres
      - MLFLOW_PGUSER=itb
      - MLFLOW_PGPASSWORD=itb
      - MLFLOW_PGDATABASE=mlflow
    volumes:
      - mlflow_artifacts:/mlruns
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ../frontend:/app
      # Persists across rebuilds; entrypoint re-syncs when package-lock.json changes
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    # entrypoint: frontend/docker-entrypoint.sh (sync deps, then exec CMD)
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  redis_data:
  postgres_data:
  web_node_modules:
  mlflow_artifacts:
  prefect_data:
