services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PIPELINE_URL=http://pipeline:8001
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - PYTHONPATH=/app
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - redis
      - pipeline
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/backend --reload-dir /app/shared --reload-dir /app/pipeline

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=configs/config-dev.jsonc
      - DATA_FOLDER=/app/data
      - PYTHONPATH=/app
    volumes:
      - ..:/app
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - redis
    command: >
      uvicorn pipeline.main:app
      --host 0.0.0.0 --port 8001
      --reload --reload-dir /app/pipeline --reload-dir /app/shared

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  redis_data:
  web_node_modules:
