[build-system]
requires = ["setuptools >= 80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-trading-bot"
version = "0.8.dev"
description = "Intelligent Trading Bot - A-share ML analysis pipeline and web UI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Alexandr Savinov", email = "savinov@conceptoriented.org"}
]
keywords = ["machine-learning", "ashare", "trading", "feature-engineering", "algorithmic-trading", "stock-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]

dependencies = [
    "apscheduler",
    "tqdm",

    "numpy==2.*",
    "pandas==2.*",
    "pyarrow",

    "akshare",

    "numba",
    "ta-lib",

    "scikit-learn==1.8.*",
    "lightgbm==4.*",
    "tensorflow==2.20.*",
    "keras==3.13.*",

    # Orchestration + model registry
    "kedro>=0.19.13,<0.20",
    "kedro-datasets[pandas]>=3.0,<4",  # CSVDataSet / ParquetDataSet / PartitionedDataSet
    # MLflow 3 LoggedModels power the experiment Models tab; keep client≈server.
    # kedro-mlflow is unused (hooks disabled in settings.py) and 0.14 pins mlflow<3.
    "mlflow>=3.1,<4",
    "prefect==3.6.4",

    # Persistence
    "sqlalchemy==2.*",
    "psycopg[binary]==3.*",
    "alembic==1.*",
]

[project.optional-dependencies]
dev = [
    #"pytest >= 7.4",
    #"ruff >= 0.2",
    #"mypy >= 1.8",
]

[project.urls]
Homepage = "https://github.com/asavinov/intelligent-trading-bot"
Documentation = "https://github.com/asavinov/intelligent-trading-bot"
Repository = "https://github.com/asavinov/intelligent-trading-bot"
"Bug Tracker" = "https://github.com/asavinov/intelligent-trading-bot/issues"

[tool.kedro]
package_name = "kedro_pipeline"
project_name = "intelligent-trading-bot"
kedro_init_version = "0.19.19"
source_dir = "."

[tool.setuptools]
packages = [
    "shared",
    "shared.collectors",
    "shared.db",
    "backend",
    "backend.db",
    "kedro_pipeline",
    "kedro_pipeline.nodes",
    "kedro_pipeline.features",
    "kedro_pipeline.labels",
    "kedro_pipeline.classifiers",
    "kedro_pipeline.signals",
    "kedro_pipeline.backtesting",
    "kedro_pipeline.orchestration",
    "kedro_pipeline.common",
    "kedro_pipeline.catalog",
    "kedro_pipeline.worker",
]
include-package-data = false

# Optional: dynamic version from __version__ or git tag (needs setuptools-scm)
# [tool.setuptools.dynamic]
# version = {attr = "my_awesome_package.__version__"}

[tool.kedro_telemetry]
project_id = "7c1153400eac436b98e9a2ea893510fb"
